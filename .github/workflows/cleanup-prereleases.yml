name: Clean up branch pre-releases

on:
  pull_request:
    types: [closed]
  delete:

jobs:
  cleanup:
    # `delete` also fires for tags; only act on branches.
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete pre-releases built from this branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref }}
        run: |
          SLUG="$(node npm-scripts/branch-slug.js "$BRANCH")"
          echo "Cleaning pre-releases for branch '${BRANCH}' (slug: ${SLUG})"

          # Matches <base>-beta.<run>.<slug> and the old <base>-<slug>.<date>.<run>, anchored so
          # 'updates' doesn't match 'mcp-updates'. isPrerelease keeps stable releases safe.
          TAGS="$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq "[.[] | select(.isPrerelease) | select(.tagName | test(\"^[0-9]+\\\\.[0-9]+\\\\.[0-9]+-(beta\\\\.[0-9]+\\\\.${SLUG}$|${SLUG}\\\\.)\")) | .tagName] | .[]")"

          if [ -z "$TAGS" ]; then
            echo "No pre-releases found for this branch."
            exit 0
          fi

          echo "$TAGS" | while read -r TAG; do
            echo "Deleting ${TAG}"
            gh release delete "$TAG" --yes --cleanup-tag
          done
